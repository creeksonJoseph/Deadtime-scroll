name: Keep Supabase Alive

on:
  schedule:
    # Run 3 times per week: Monday, Wednesday, Friday at 9:00 AM UTC
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch: # Allow manual trigger

jobs:
  keepalive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase API
        run: |
          echo "Pinging Supabase to keep project alive..."
          
          # Ping the projects table (simple read operation)
          response=$(curl -s -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1")
          
          http_code="${response: -3}"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Supabase ping successful (HTTP $http_code)"
          else
            echo "❌ Supabase ping failed (HTTP $http_code)"
            exit 1
          fi
          
          echo "Supabase project is awake and responsive!"